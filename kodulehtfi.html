	<div class="bus-widget" id="bus-widget">
		<div class="bus-widget-inner">
			<div class="bus-number-badge">16</div>
			<div>
				<div class="bus-time" id="bus-countdown">Laeb...</div>
				<div class="bus-next-times" id="bus-next-times"></div>
			</div>
		</div>

	</div>

</header>

<script>
    function updateClock() {
        var now = new Date();
        var hours = now.getHours().toString().padStart(2, '0');
        var minutes = now.getMinutes().toString().padStart(2, '0');
        var seconds = now.getSeconds().toString().padStart(2, '0');
        var timeString = hours + ':' + minutes + ':' + seconds;
        document.getElementById('digital-clock').innerHTML = timeString;

        var date = now.getDate().toString().padStart(2, '0');
        var month = (now.getMonth() + 1).toString().padStart(2, '0'); // Months are zero-based
        var year = now.getFullYear();
        var dateString = date + '.' + month + '.' + year;
        document.getElementById('current-date').innerHTML = dateString;
    }

    // Update the clock and date every second
    setInterval(updateClock, 1000);

    // Initial call to display the clock and date immediately
    updateClock();

    // Bus 16 countdown
    let busSecondsLeft = [];

    function fetchBus16() {
        const url = 'https://transport.tallinn.ee/siri-stop-departures.php?stopid=1322';
        fetch(url)
            .then(r => r.text())
            .then(text => {
                const lines = text.trim().split(/\r?\n/);
                const header = lines.find(l => l.startsWith('Transport'));
                const currentSeconds = parseInt(header.split(',')[4], 10) || 0;

                busSecondsLeft = [];
                for (const line of lines) {
                    if (!line.startsWith('bus,')) continue;
                    const parts = line.split(',');
                    if (parts[1] === '16') {
                        const remaining = parseInt(parts[2], 10) - currentSeconds;
                        if (remaining >= -30) busSecondsLeft.push(remaining);
                    }
                }
                busSecondsLeft.sort((a, b) => a - b);
                updateBusDisplay();
            })
            .catch(() => {
                document.getElementById('bus-countdown').textContent = 'Viga';
            });
    }

    function updateBusDisplay() {
        if (busSecondsLeft.length === 0) return;

        const next = busSecondsLeft[0];
        const el = document.getElementById('bus-countdown');

        if (next <= 0) {
            el.textContent = 'Praegu!';
            el.className = 'bus-time soon';
        } else {
            const m = Math.floor(next / 60);
            const s = next % 60;
            el.textContent = m + ' min ' + s.toString().padStart(2, '0') + ' sek';
            el.className = next < 120 ? 'bus-time soon' : 'bus-time';
        }

        const upcoming = busSecondsLeft.slice(1, 3);
        const nextTimesEl = document.getElementById('bus-next-times');
        if (upcoming.length > 0) {
            const parts = upcoming.map(s => {
                const m = Math.floor(s / 60);
                const sec = s % 60;
                return m + ':' + sec.toString().padStart(2, '0');
            });
            nextTimesEl.textContent = 'Järgmised: ' + parts.join(' · ');
        }
    }

    fetchBus16();
    setInterval(fetchBus16, 1000);
</script>
