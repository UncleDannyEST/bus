<script>
    function updateClock() {
        var now = new Date();
        var hours = now.getHours().toString().padStart(2, '0');
        var minutes = now.getMinutes().toString().padStart(2, '0');
        var seconds = now.getSeconds().toString().padStart(2, '0');
        var timeString = hours + ':' + minutes + ':' + seconds;
        document.getElementById('digital-clock').innerHTML = timeString;

        var date = now.getDate().toString().padStart(2, '0');
        var month = (now.getMonth() + 1).toString().padStart(2, '0'); // Months are zero-based
        var year = now.getFullYear();
        var dateString = date + '.' + month + '.' + year;
        document.getElementById('current-date').innerHTML = dateString;
    }

    // Update the clock and date every second
    setInterval(updateClock, 1000);

    // Initial call to display the clock and date immediately
    updateClock();
</script>
