<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Peatuste graafik</title>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 18px; }
  h2 { margin-top: 0; }
  .section-heading { margin-top: 28px; }
  table { border-collapse: collapse; width: 100%; max-width: 700px; }
  th, td { padding: 8px; border-bottom: 1px solid #ddd; text-align: left; }
  th { background: #f4f4f4; }
  .muted { color: #666; font-size: 0.9em; }
  .route-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    color: white;
    font-weight: 600;
    min-width: 2.2em;
    text-align: center;
  }
  .route-bus { background: #00E1B4; }
  .route-trol { background: #1170B3; }
</style>
</head>
<body>
<h2>Marja (suunaga Kesklinn) - Väljumised</h2>
<div id="marja-status" class="muted">Loading…</div>
<table id="marja-table" style="display:none">
  <thead>
    <tr><th>Liin</th><th>Sihtpunkt</th><th>Saabumiseni</th></tr>
  </thead>
  <tbody id="marja-body"></tbody>
</table>

<h2 class="section-heading">Estonia (suunaga Mustamäe) - Väljumised</h2>
<div id="estonia-status" class="muted">Loading…</div>
<table id="estonia-table" style="display:none">
  <thead>
    <tr><th>Liin</th><th>Sihtpunkt</th><th>Saabumiseni</th></tr>
  </thead>
  <tbody id="estonia-body"></tbody>
</table>

<script>
const stops = [
  {
    urls: ["https://transport.tallinn.ee/siri-stop-departures.php?stopid=1116"],
    statusId: "marja-status",
    tableId: "marja-table",
    bodyId: "marja-body"
  },
  {
    urls: [
      "https://transport.tallinn.ee/siri-stop-departures.php?stopid=14969",
      "https://transport.tallinn.ee/siri-stop-departures.php?stopid=1628"
    ],
    routes: ["16", "81"],
    statusId: "estonia-status",
    tableId: "estonia-table",
    bodyId: "estonia-body"
  }
];

function toMinSec(seconds) {
  if (seconds == null || isNaN(seconds)) return "—";
  if (seconds < 0) return "Kohe";
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return `${m} min ${s} s`;
}

function parseFeed(text) {
  const lines = text.trim().split(/\r?\n/);
  const header = lines.find(l => l.startsWith("Transport"));
  const headerParts = header.split(",");
  const currentSeconds = parseInt(headerParts[4], 10) || 0;

  const buses = [];
  for (const line of lines) {
    if (!line.startsWith("bus,") && !line.startsWith("trol,")) continue;
    const parts = line.split(",");
    const route = parts[1];
    const expected = parseInt(parts[2], 10);
    const dest = parts[4];
    const remaining = expected - currentSeconds;
    const type = line.startsWith("bus,") ? "bus" : "trol";
    buses.push({ route, dest, remaining, type });
  }

  return buses;
}

function closestByRoute(buses) {
  // Keep only the closest departure for each line across all fetched feeds
  const closest = {};
  for (const b of buses) {
    if (!closest[b.route] || b.remaining < closest[b.route].remaining) {
      closest[b.route] = b;
    }
  }
  return Object.values(closest).sort((a,b)=>a.remaining-b.remaining);
}

function render(rows, config) {
  const body = document.getElementById(config.bodyId);
  const tbl = document.getElementById(config.tableId);
  const status = document.getElementById(config.statusId);
  body.innerHTML = "";
  if (!rows.length) {
    status.textContent = "No departures found.";
    tbl.style.display = "none";
    return;
  }
  for (const r of rows) {
    const tr = document.createElement("tr");
    const badgeClass = r.type === "trol" ? "route-trol" : "route-bus";
    tr.innerHTML = `<td><span class="route-badge ${badgeClass}">${r.route}</span></td><td>${r.dest}</td><td>${toMinSec(r.remaining)}</td>`;
    body.appendChild(tr);
  }
  const now = new Date();
  status.textContent =
      "Uuendatud: " + now.toLocaleTimeString('en-GB', { hour12: false });
  tbl.style.display = "";
}

async function loadAndShow(config) {
  try {
    const responses = await Promise.all(config.urls.map(url => fetch(url)));
    for (const res of responses) {
      if (!res.ok) throw new Error("HTTP " + res.status);
    }
    const feeds = await Promise.all(responses.map(res => res.text()));
    const rows = closestByRoute(feeds.flatMap(parseFeed))
      .filter(row => !config.routes || config.routes.includes(row.route));
    render(rows, config);
  } catch (e) {
    document.getElementById(config.statusId).textContent = "Error: " + e.message;
  }
}

for (const config of stops) {
  loadAndShow(config);
  setInterval(() => loadAndShow(config), 1000); // refresh every 1s
}
</script>
</body>
</html>
